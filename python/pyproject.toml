[project]
name = "dsa"
version = "0.1.0"
description = "LeetCode and DSA practice in Python."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
dsa = "dsa.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
