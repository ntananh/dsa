[project]
name = "dsa"
version = "0.1.0"
description = "LeetCode and DSA practice in Python."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
dsa = "dsa.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify, naming
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

[tool.ruff.lint.per-file-ignores]
# Solutions keep LeetCode's camelCase method and parameter names.
"leetcode/**" = ["N802", "N803"]
